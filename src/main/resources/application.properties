spring.application.name=dev-diaries

spring.config.import=optional:dotenv
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devdiaries}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
app.security.secret-key=${SECRET_KEY:0123456789abcdef0123456789abcdef}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.problemdetails.enabled=true
spring.web.error.include-stacktrace=always
spring.web.error.include-exception=true
spring.web.error.include-message=always

logging.level.org.springframework.security=trace


